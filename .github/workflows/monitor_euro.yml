name: Monitorar Cotação do Euro

on:
  schedule:
    # Roda a cada 15 min, das 11:00 às 22:00 UTC (08:00 às 19:00 em Brasília), de Seg a Sex
    - cron: '*/15 11-22 * * 1-5'
  workflow_dispatch: # Cria um botão para você testar manualmente quando quiser

jobs:
  verificar_cotacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar verificação do Euro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRECO_ALVO: '6.18'
        run: python monitor_euro.py
